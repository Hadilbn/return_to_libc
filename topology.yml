name: return-to-libc-tp

# Un seul hôte "seed" (comme library-clickjacking-cupcakes) : l'étudiant
# compile/exploite localement sur cette machine, pas de serveur distant.
# !! Vérifiez "image" et "mgmt_user" auprès de votre administrateur. L'image
# est bien résolue en "seed" par OpenStack, mais la VM "seed" a échoué à
# atteindre l'état ACTIVE avec le flavor standard.small (alors que "man" et
# "router" ont démarré sans problème) : le flavor a été monté à
# standard.medium (l'image "seed" est une image desktop plus lourde qu'une
# image serveur minimale et nécessite plus de RAM/disque).
hosts:
  - name: seed
    base_box:
      image: seed-ubuntu-20.04
      mgmt_user: ubuntu
    flavor: standard.medium

routers:
  - name: router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.small

wan:
  name: internet-connection
  cidr: 100.100.100.0/24

networks:
  - name: seed-switch
    cidr: 10.1.27.0/24

net_mappings:
  - host: seed
    network: seed-switch
    ip: 10.1.27.10

router_mappings:
  - router: router
    network: seed-switch
    ip: 10.1.27.1

groups: []
